<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEON DASH — NORMAL</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 10%,#13244c,#060918 70%);color:#e9faff;font-family:system-ui,Arial;min-height:100vh;display:flex;align-items:center;justify-content:center}.wrap{width:min(980px,100%);padding:16px}h1{text-align:center;color:#46f5ff;text-shadow:0 0 25px #00cfff;margin:6px 0}header{text-align:center;color:#aebcdb;margin-bottom:12px}.panel{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-bottom:10px} .stat{border:1px solid #28567b;background:#0d1930;padding:8px 15px;border-radius:10px}canvas{width:100%;height:auto;border:2px solid #37dff8;box-shadow:0 0 27px #00ccff42;border-radius:12px;background:#080d20;display:block;touch-action:none}button,a.btn{background:#142447;border:1px solid #44eaff;color:#dffcff;padding:11px 17px;border-radius:9px;font:inherit;cursor:pointer;text-decoration:none}button:hover{background:#183b62}.buttons{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:13px}.help{text-align:center;color:#a9b9d4;font-size:14px;margin-top:9px}.mobile{display:flex;justify-content:space-around;margin-top:12px}.mobile button{min-width:100px;touch-action:none;font-weight:bold;font-size:20px}.msg{color:#ff8bdc;text-align:center;min-height:23px;margin-top:8px}</style><script>function reportArcade(value){const n=Number(value);if(Number.isFinite(n)&&n>=0){try{parent.postMessage({neonArcadeScore:true,score:Math.round(n)},'*')}catch(e){}}}</script></head><body><div class="wrap"><h1>⚡ NEON DASH</h1><header>MODE NORMAL • Saute, évite les lasers et franchis les 5 secteurs !</header><div class="panel"><div class="stat">Secteur : <b id="level">1 / 5</b></div><div class="stat">Morts : <b id="deaths">0</b></div><div class="stat">Temps : <b id="clock">0.0 s</b></div><div class="stat">Record : <b id="best">—</b></div></div><canvas id="game" width="900" height="450"></canvas><div id="msg" class="msg">Appuie sur JOUER pour commencer.</div><div class="buttons"><button id="start">▶ JOUER / RECOMMENCER</button><button id="pause">⏸ PAUSE</button><button id="sound">♫ MUSIQUE : ON</button></div><div class="mobile"><button id="left">◀</button><button id="jump">⤒ SAUT</button><button id="right">▶</button></div><div class="help">PC : ← → / A D pour bouger • Espace / ↑ / W pour sauter (double saut) • P pour pause. Atteins la porte verte !</div></div><script>
'use strict';
const MODE='normal'; const CFG={"speed": 265, "jump": 465, "gravity": 1050, "sections": 4, "spikeWidth": 0, "extra": false, "seed": 1};
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');const $=id=>document.getElementById(id);
const W=900,H=450,GROUND=400;let level=0,deaths=0,elapsed=0,running=false,paused=false,won=false,last=0,cam=0,player,platforms=[],hazards=[],coins=[],goalX=0,keys={left:false,right:false},music=true,audio=null,musicTimer=0;
const bestKey='neondash-best-'+MODE;try{$('best').textContent=localStorage.getItem(bestKey)||'—'}catch(e){}
function tone(freq=440,duration=.08,type='sine',vol=.025){if(!music)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+duration)}catch(e){}}
function rand(seed){let v=seed>>>0;return()=>{v=(Math.imul(v,1664525)+1013904223)>>>0;return v/4294967296}}
function build(n){const r=rand(5481+n*791+CFG.seed),count=CFG.sections+Math.min(4,n),seg=245;platforms=[{x:-200,y:GROUND,w:700,h:70}];hazards=[];coins=[];for(let i=1;i<=count;i++){const x=250+i*seg;const y=GROUND-(75+Math.floor(r()*3)*40);const w=105+Math.floor(r()*45);platforms.push({x,y,w,h:18});if(i%3===0)platforms.push({x:x+155,y:GROUND-60,w:85,h:18});if(i>1){const dangerX=x-105;hazards.push({x:dangerX,y:GROUND-30,w:25+CFG.spikeWidth,h:30,type:'spike'});}if(i%2===0)hazards.push({x:x+27,y:y-32,w:28,h:32,type:'spike'});coins.push({x:x+w/2,y:y-42,got:false})}goalX=250+(count+1)*seg;platforms.push({x:goalX-135,y:GROUND-20,w:390,h:70});if(CFG.extra){for(let i=3;i<=count;i+=3){const x=250+i*seg+95;hazards.push({x,y:190,w:15,h:115,type:'laser',phase:i*.7})}}player={x:55,y:GROUND-36,w:26,h:36,vx:0,vy:0,jumps:0,inv:0};cam=0;$('level').textContent=(n+1)+' / 5';}
function start(){level=0;deaths=0;elapsed=0;won=false;running=true;paused=false;keys.left=keys.right=false;build(level);$('deaths').textContent='0';$('msg').textContent='Atteins la porte verte !';last=performance.now();tone(630,.14,'triangle')}
function fail(){deaths++;$('deaths').textContent=deaths;player={x:55,y:GROUND-36,w:26,h:36,vx:0,vy:0,jumps:0,inv:.8};cam=0;tone(130,.25,'sawtooth');$('msg').textContent='Recommence le secteur !'}
function jump(){if(!running||paused)return;if(player.jumps<2){player.vy=player.jumps===0?-CFG.jump:-CFG.jump*.89;player.jumps++;tone(player.jumps===1?540:720,.09,'triangle')}}
function intersects(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function update(dt){elapsed+=dt;$('clock').textContent=elapsed.toFixed(1)+' s';musicTimer+=dt;if(music&&musicTimer>.25){musicTimer=0;if(Math.floor(elapsed*4)%2===0)tone(110+level*22,.055,'triangle',.009)}const oldY=player.y;const oldBottom=oldY+player.h;player.vx=(Number(keys.right)-Number(keys.left))*CFG.speed;player.x+=player.vx*dt;player.vy+=CFG.gravity*dt;player.y+=player.vy*dt;player.inv=Math.max(0,player.inv-dt);let landed=false;for(const p of platforms){if(player.vy>=0&&player.x+player.w>p.x+5&&player.x<p.x+p.w-5&&oldBottom<=p.y+8&&player.y+player.h>=p.y){player.y=p.y-player.h;player.vy=0;player.jumps=0;landed=true}}if(player.y+player.h>=GROUND&&player.x>=-200&&player.x<475){player.y=GROUND-player.h;player.vy=0;player.jumps=0;landed=true}if(player.y>H+150){fail();return}for(const h of hazards){if(h.type==='laser'){h.y=195+45*Math.sin(elapsed*2.2+h.phase)}if(player.inv<=0&&intersects(player,h)){fail();return}}for(const c of coins){if(!c.got&&Math.hypot(player.x+13-c.x,player.y+18-c.y)<29){c.got=true;tone(800,.12,'sine')}}if(player.x>goalX+60){if(level===4){won=true;running=false;reportArcade(Math.round(elapsed*1000));$('msg').textContent='🏆 VICTOIRE ! Temps : '+elapsed.toFixed(1)+' s · Morts : '+deaths;try{const s=elapsed.toFixed(1)+' s';localStorage.setItem(bestKey,s);$('best').textContent=s}catch(e){}tone(950,.45);return}level++;build(level);$('msg').textContent='Secteur '+(level+1)+' !';tone(940,.21,'triangle')}cam=Math.max(0,player.x-220)}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#070d20';ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(-cam*.25,0);ctx.strokeStyle='#15294e';ctx.lineWidth=1;for(let x=0;x<W+cam*.25+100;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W+cam*.25+100,y);ctx.stroke()}ctx.restore();ctx.save();ctx.translate(-cam,0);for(const p of platforms){ctx.shadowColor='#24eaff';ctx.shadowBlur=10;ctx.fillStyle='#122b47';ctx.strokeStyle='#28eeff';ctx.lineWidth=2;ctx.fillRect(p.x,p.y,p.w,p.h);ctx.strokeRect(p.x,p.y,p.w,p.h)}for(const h of hazards){ctx.shadowColor='#ff348b';ctx.shadowBlur=16;ctx.fillStyle='#ff448f';if(h.type==='spike'){ctx.beginPath();ctx.moveTo(h.x,h.y+h.h);ctx.lineTo(h.x+h.w/2,h.y);ctx.lineTo(h.x+h.w,h.y+h.h);ctx.closePath();ctx.fill()}else ctx.fillRect(h.x,h.y,h.w,h.h)}for(const c of coins){if(c.got)continue;ctx.shadowColor='#ffdb58';ctx.shadowBlur=16;ctx.fillStyle='#ffe35f';ctx.beginPath();ctx.arc(c.x,c.y,9,0,Math.PI*2);ctx.fill()}ctx.shadowColor='#40ffa6';ctx.shadowBlur=25;ctx.strokeStyle='#49ffba';ctx.lineWidth=5;ctx.strokeRect(goalX+85,GROUND-98,50,78);ctx.fillStyle='#42ffa740';ctx.fillRect(goalX+85,GROUND-98,50,78);ctx.shadowColor='#ff60f0';ctx.shadowBlur=20;ctx.fillStyle=player.inv>0?'#e6ffff':'#f263f5';ctx.fillRect(player.x,player.y,player.w,player.h);ctx.restore();ctx.shadowBlur=0;if(!running||paused){ctx.fillStyle='#06091ab9';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle='#66f4ff';ctx.font='bold 34px system-ui';ctx.fillText(won?'VICTOIRE !':paused?'PAUSE':'NEON DASH',W/2,205);ctx.fillStyle='#ddeaff';ctx.font='19px system-ui';ctx.fillText(won?'Bravo ! Lance une autre partie.':'Appuie sur JOUER pour commencer',W/2,244)}}
function loop(now){const dt=Math.min(.034,(now-last)/1000||0);last=now;if(running&&!paused)update(dt);draw();requestAnimationFrame(loop)}
$('start').addEventListener('click',start);$('pause').addEventListener('click',()=>{if(running)paused=!paused});$('sound').addEventListener('click',()=>{music=!music;$('sound').textContent='♫ MUSIQUE : '+(music?'ON':'OFF');if(music)tone(500)});
const control={ArrowLeft:'left',KeyA:'left',KeyQ:'left',ArrowRight:'right',KeyD:'right'};window.addEventListener('keydown',e=>{if(control[e.code]){keys[control[e.code]]=true;e.preventDefault()}if(['Space','ArrowUp','KeyW','KeyZ'].includes(e.code)){if(!e.repeat)jump();e.preventDefault()}if(e.code==='KeyP'&&running)paused=!paused});window.addEventListener('keyup',e=>{if(control[e.code]){keys[control[e.code]]=false;e.preventDefault()}});window.addEventListener('blur',()=>{keys.left=keys.right=false;if(running)paused=true});
for(const [id,k] of [['left','left'],['right','right']]){const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId)});for(const event of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(event,()=>keys[k]=false)}$('jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});build(0);requestAnimationFrame(loop);
</script></body></html>
