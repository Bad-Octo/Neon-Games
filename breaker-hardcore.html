<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Breaker — Nouvelle version</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#172448,#060914 75%);font-family:system-ui,Arial,sans-serif;color:#e6fbff;display:flex;justify-content:center;align-items:center;padding:14px}.shell{width:min(100%,720px);text-align:center}h1{letter-spacing:.17em;text-shadow:0 0 18px #00eaff;color:#6cfaff;margin:10px 0}.info{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:12px 0;color:#9ee4ff;font-weight:700}.frame{border:2px solid #48d8ff;border-radius:14px;box-shadow:0 0 25px #00baff55;overflow:hidden}canvas{display:block;width:100%;height:auto;background:#070e23;touch-action:none}button{background:#112d54;color:#ccfaff;border:1px solid #3fdcff;padding:12px 20px;border-radius:10px;font-weight:800;cursor:pointer;margin:12px 5px;box-shadow:0 0 14px #00d9ff55}button:hover{background:#195183}.small{color:#a3b5d9;font-size:14px}.pill{color:#ffcf66}
</style>
<script>function reportArcade(value){const n=Number(value);if(Number.isFinite(n)&&n>=0){try{parent.postMessage({neonArcadeScore:true,score:Math.round(n)},'*')}catch(e){}}}</script></head>
<body><main class="shell">
<h1>NEON BREAKER</h1>
<div class="info"><span id="score">SCORE 0</span><span id="level">NIVEAU 1</span><span id="lives">VIES 3</span></div>
<div class="frame"><canvas id="game" width="660" height="520" aria-label="Jeu de casse-briques"></canvas></div>
<button id="start" type="button">▶ JOUER / RECOMMENCER</button><button id="sound" type="button">♪ SON : OUI</button>
<div class="small">Souris / doigt / flèches ← → pour déplacer la raquette. <span class="pill">Mode hardcore : blocs résistants, balle rapide.</span></div>
</main><script>
'use strict';
(function(){
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const scoreTag=document.getElementById('score'),levelTag=document.getElementById('level'),livesTag=document.getElementById('lives');
const width=660,height=520,keys={};
let running=false,score=0,level=1,lives=3,paddleX=295,bricks=[],ball={x:330,y:420,vx:5.2,vy:-6.3,r:8},sound=true,audio=null,previous=0;
function beep(freq){if(!sound)return;try{if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.035,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.08);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.09)}catch(_){}}
function refresh(){scoreTag.textContent='SCORE '+score;levelTag.textContent='NIVEAU '+level;livesTag.textContent='VIES '+lives;}
function makeBricks(){bricks=[];const cols=10,rows=Math.min(5+Math.floor(level/2),8),gap=7,margin=25,bw=(width-2*margin-gap*(cols-1))/cols;for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){bricks.push({x:margin+c*(bw+gap),y:65+r*29,w:bw,h:21,hp:1+Math.floor((r+level-1)/3),max:1+Math.floor((r+level-1)/3)})}}
function newBall(){ball={x:paddleX+35,y:422,vx:(Math.random()<.5?-1:1)*(4.3+level*.3),vy:-(6.1+level*.35),r:8}}
function reset(){score=0;level=1;lives=3;paddleX=295;makeBricks();newBall();running=true;refresh();beep(700)}
function coordinate(e){const rect=canvas.getBoundingClientRect();return (e.clientX-rect.left)*width/rect.width}
canvas.addEventListener('pointermove',e=>{paddleX=Math.max(0,Math.min(width-70,coordinate(e)-35))});
canvas.addEventListener('pointerdown',e=>{paddleX=Math.max(0,Math.min(width-70,coordinate(e)-35));if(!running)reset()});
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();keys[e.code]=true;if(e.code==='Space'&&!running)reset()});
window.addEventListener('keyup',e=>{keys[e.code]=false});
document.getElementById('start').addEventListener('click',reset);
document.getElementById('sound').addEventListener('click',function(){sound=!sound;this.textContent='♪ SON : '+(sound?'OUI':'NON')});
function roundedRect(x,y,w,h,color,blur){ctx.shadowColor=color;ctx.shadowBlur=blur;ctx.fillStyle=color;ctx.fillRect(x,y,w,h);ctx.shadowBlur=0}
function frame(time){let dt=previous?Math.min((time-previous)/16.6667,2):1;previous=time;
ctx.fillStyle='#070e23';ctx.fillRect(0,0,width,height);
for(let i=0;i<20;i++){ctx.fillStyle='#243860';ctx.fillRect((i*179)%width,(i*97)%height,2,2)}
if(running){
if(keys.ArrowLeft||keys.KeyA)paddleX-=9*dt;
if(keys.ArrowRight||keys.KeyD)paddleX+=9*dt;
paddleX=Math.max(0,Math.min(width-70,paddleX));
let oldX=ball.x,oldY=ball.y;
ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
if(ball.x<ball.r){ball.x=ball.r;ball.vx=Math.abs(ball.vx);beep(220)}
if(ball.x>width-ball.r){ball.x=width-ball.r;ball.vx=-Math.abs(ball.vx);beep(220)}
if(ball.y<ball.r){ball.y=ball.r;ball.vy=Math.abs(ball.vy)}
if(ball.vy>0&&oldY+ball.r<=454&&ball.y+ball.r>=454&&ball.x>=paddleX-8&&ball.x<=paddleX+78){ball.y=454-ball.r;ball.vy=-Math.abs(ball.vy);ball.vx+=(ball.x-paddleX-35)*.055;ball.vx=Math.max(-11,Math.min(11,ball.vx));beep(620)}
if(ball.y>height+15){lives--;if(lives<=0){running=false;reportArcade(score);beep(150)}else{newBall();beep(180)}refresh()}
for(const b of bricks){if(b.hp<=0)continue;if(ball.x+ball.r>b.x&&ball.x-ball.r<b.x+b.w&&ball.y+ball.r>b.y&&ball.y-ball.r<b.y+b.h){b.hp--;score+=b.hp<=0?20:5;
if(oldX+ball.r<=b.x||oldX-ball.r>=b.x+b.w)ball.vx*=-1;else ball.vy*=-1;beep(350+Math.random()*450);refresh();break}}
if(bricks.every(b=>b.hp<=0)){level++;score+=100;makeBricks();newBall();refresh();beep(900)}
}
for(const b of bricks){if(b.hp<=0)continue;const colors=['#ff4fbf','#9d78ff','#36dbff','#33ffae','#fdea70'];const color=colors[(b.max-1)%colors.length];roundedRect(b.x,b.y,b.w,b.h,color,9);if(b.hp>1){ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.fillStyle='#071327';ctx.fillText(String(b.hp),b.x+b.w/2,b.y+15)}}
roundedRect(paddleX,454,70,12,'#36e7ff',20);
ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fillStyle='#fff4aa';ctx.shadowColor='#ffe588';ctx.shadowBlur=22;ctx.fill();ctx.shadowBlur=0;
if(!running){ctx.fillStyle='#071426e3';ctx.fillRect(95,196,470,120);ctx.fillStyle='#a4faff';ctx.textAlign='center';ctx.font='bold 29px system-ui';ctx.fillText(lives===0?'PARTIE TERMINÉE':'NEON BREAKER',330,248);ctx.fillStyle='#e2edff';ctx.font='16px system-ui';ctx.fillText('Clique sur JOUER pour commencer',330,278)}
requestAnimationFrame(frame)
}
requestAnimationFrame(frame);
})();
</script></body></html>
