<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEON CIRCUIT — jouable</title>
<style>
:root{color-scheme:dark;--cyan:#42f5ff;--pink:#f76ce4;--green:#6bffb3}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#050916;color:#e9faff;font:16px system-ui,Arial;display:flex;align-items:center;justify-content:center}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at top,#152b59 0,transparent 65%),linear-gradient(#43e9ff06 1px,transparent 1px),linear-gradient(90deg,#43e9ff06 1px,transparent 1px);background-size:auto,36px 36px,36px 36px}.wrap{position:relative;width:min(96vw,540px);padding:18px 8px 26px}h1{text-align:center;margin:0;color:var(--cyan);font-size:clamp(30px,8vw,44px);letter-spacing:.12em;text-shadow:0 0 28px #32efff80}.sub{text-align:center;color:#e791ed;font-size:11px;letter-spacing:.2em;margin:4px 0 17px}.stats{display:flex;gap:8px;margin-bottom:12px}.stat{flex:1;background:#0c1731;border:1px solid #38587c;border-radius:11px;padding:9px;text-align:center;font-size:11px;color:#94b6d4}.stat strong{display:block;font-size:24px;color:#fff}.board{background:#070f24;border:2px solid var(--cyan);box-shadow:0 0 32px #1edbff45;border-radius:12px;padding:5px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px;aspect-ratio:1}.tile{position:relative;border:1px solid #243a65;border-radius:5px;background:#111e3b;min-width:0;min-height:0;padding:0;display:flex;align-items:center;justify-content:center;touch-action:manipulation;cursor:pointer;transition:background .1s,filter .1s}.tile:active{background:#244b72;filter:brightness(1.5)}.tile:focus-visible{outline:2px solid white;outline-offset:-2px}.tile svg{display:block;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 3px #5585b8)}.tile.lit svg{filter:drop-shadow(0 0 7px #18ffdb)}.tile .mark{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-weight:900;border-radius:50%;width:36%;height:36%;display:grid;place-items:center;font-size:clamp(10px,3.6vw,20px);pointer-events:none}.tile.source .mark{color:#071d19;background:#7fffc5;box-shadow:0 0 13px #2cffac}.tile.target .mark{color:#27041d;background:#ffa5ed;box-shadow:0 0 13px #ff59db}.tile.source{outline:2px solid #55ffac;outline-offset:-3px}.tile.target{outline:2px solid #fd76df;outline-offset:-3px}.actions{display:flex;gap:7px;margin-top:13px}.actions button{flex:1;cursor:pointer;font-weight:800;border:1px solid #40d7ee;border-radius:10px;padding:13px 4px;color:#d9ffff;background:#11314a;font-size:12px}.actions button.primary{background:#1bc6d7;color:#001520}.actions button:active{transform:scale(.97)}#message{text-align:center;min-height:46px;margin:13px 0 2px;font-size:14px;line-height:1.5}.hint{text-align:center;color:#91abc8;font-size:12px;line-height:1.5;margin:0}.hidden{display:none}.win{color:#80ffc1}.lose{color:#ff89b1}
</style><script>function reportArcade(value){const n=Number(value);if(Number.isFinite(n)&&n>=0){try{parent.postMessage({neonArcadeScore:true,score:Math.round(n)},'*')}catch(e){}}}</script></head><body><main class="wrap"><h1>NEON CIRCUIT</h1><p class="sub">TOURNE • CONNECTE • GAGNE</p><div class="stats"><div class="stat">NIVEAU<strong id="level">1</strong></div><div class="stat">TEMPS<strong id="time">45</strong></div><div class="stat">SCORE<strong id="score">0</strong></div></div><div id="board" class="board" aria-label="Grille de circuits"></div><div class="actions"><button class="primary" id="start" type="button">▶ JOUER</button><button id="sound" type="button">♫ SON : ON</button><button id="reset" type="button">↻ RESET</button></div><p id="message">Appuie sur <b>JOUER</b> puis tourne les cases pour relier <b style="color:#6bffb3">S</b> à <b style="color:#ffa5ed">C</b>.</p><p class="hint">Clique ou touche une case : elle tourne de 90°. Les tuyaux qui se touchent s'allument !</p></main>
<script>
(function(){'use strict';
var board=document.getElementById('board'),msg=document.getElementById('message');var level=1,score=0,seconds=45,playing=false,cells=[],size=5,source=0,target=0,powered=new Set(),tick=0,sound=true,audio=null,locked=false;
var DX=[0,1,0,-1],DY=[-1,0,1,0],BIT=[1,2,4,8];
function rand(max){return Math.floor(Math.random()*max)}
function rotate(mask){return ((mask<<1)&15)|(mask>>3)}
function id(x,y){return y*size+x}
function tone(f){if(!sound)return;try{if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();var o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.055,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.09);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.09)}catch(e){}}
function ui(){document.getElementById('level').textContent=level;document.getElementById('score').textContent=score;document.getElementById('time').textContent=Math.ceil(seconds)}
function makeLevel(){size=level>=6?6:5;board.style.gridTemplateColumns='repeat('+size+',minmax(0,1fr))';var attempts=0,path=[];
// Random but guaranteed solvable simple path, with no side branches required.
while(attempts++<400){var sx=0,sy=rand(size),x=sx,y=sy,seen=new Set([id(x,y)]);path=[[x,y]];while(x<size-1&&path.length<size*size){var opts=[];for(var d=0;d<4;d++){var xx=x+DX[d],yy=y+DY[d];if(xx>=0&&xx<size&&yy>=0&&yy<size&&!seen.has(id(xx,yy)))opts.push([xx,yy])}if(!opts.length)break;var next=opts[rand(opts.length)];x=next[0];y=next[1];seen.add(id(x,y));path.push([x,y])}if(x===size-1)break}
if(path[path.length-1][0]!==size-1){path=[];for(var i=0;i<size;i++)path.push([i,Math.floor(size/2)])}
cells=Array.from({length:size*size},function(){return {mask:[3,5,6,9,10,12,7,11,13,14][rand(10)]}});
for(var j=0;j<path.length;j++){var mask=0;for(var q of [j-1,j+1]){if(q<0||q>=path.length)continue;var dx=path[q][0]-path[j][0],dy=path[q][1]-path[j][1];for(var d=0;d<4;d++)if(DX[d]===dx&&DY[d]===dy)mask|=BIT[d]}cells[id(path[j][0],path[j][1])].mask=mask}
source=id(path[0][0],path[0][1]);target=id(path[path.length-1][0],path[path.length-1][1]);for(var c of cells){var n=rand(4);for(var z=0;z<n;z++)c.mask=rotate(c.mask)}
seconds=Math.max(24,48-level*2);playing=true;locked=false;msg.innerHTML='⚡ Relie la <b style="color:#6bffb3">source verte</b> à la <b style="color:#ffa5ed">cible rose</b> !';compute();draw();ui()}
function compute(){powered=new Set([source]);var todo=[source];while(todo.length){var i=todo.pop(),x=i%size,y=Math.floor(i/size);for(var d=0;d<4;d++){if(!(cells[i].mask&BIT[d]))continue;var nx=x+DX[d],ny=y+DY[d];if(nx<0||ny<0||nx>=size||ny>=size)continue;var k=id(nx,ny);if((cells[k].mask&BIT[(d+2)%4])&&!powered.has(k)){powered.add(k);todo.push(k)}}}}
function tileSvg(mask,lit){var parts='';for(var d=0;d<4;d++)if(mask&BIT[d]){var xs=[50,100,50,0][d],ys=[0,50,100,50][d];parts+='<line x1="50" y1="50" x2="'+xs+'" y2="'+ys+'" stroke="'+(lit?'#28e8d8':'#375987')+'" stroke-width="17" stroke-linecap="round"/><line x1="50" y1="50" x2="'+xs+'" y2="'+ys+'" stroke="'+(lit?'#d5fff2':'#7ba9dd')+'" stroke-width="5" stroke-linecap="round"/>'}return '<svg viewBox="0 0 100 100" aria-hidden="true">'+parts+'<circle cx="50" cy="50" r="10" fill="'+(lit?'#e7fff7':'#789dcc')+'"/></svg>'}
function draw(){board.innerHTML='';for(var i=0;i<cells.length;i++){var b=document.createElement('button');b.type='button';b.className='tile'+(powered.has(i)?' lit':'')+(i===source?' source':'')+(i===target?' target':'');b.dataset.index=i;b.setAttribute('aria-label','Tourner la case '+(i+1));b.innerHTML=tileSvg(cells[i].mask,powered.has(i))+(i===source?'<span class="mark">S</span>':i===target?'<span class="mark">C</span>':'');board.appendChild(b)}}
board.addEventListener('click',function(e){var b=e.target.closest('button[data-index]');if(!b||!board.contains(b))return;if(!playing){msg.textContent='Appuie d’abord sur ▶ JOUER pour lancer la partie.';return}var i=Number(b.dataset.index);cells[i].mask=rotate(cells[i].mask);tone(340+i*9);compute();draw();if(powered.has(target)&&!locked){locked=true;playing=false;score+=Math.ceil(seconds)*10+level*100;reportArcade(score);ui();msg.innerHTML='<span class="win">✔ BRAVO ! CIRCUIT CONNECTÉ — NIVEAU SUIVANT !</span>';tone(880);setTimeout(function(){level++;makeLevel()},1100)}});
function start(){level=1;score=0;makeLevel();tone(550)}
document.getElementById('start').addEventListener('click',start);document.getElementById('reset').addEventListener('click',start);document.getElementById('sound').addEventListener('click',function(){sound=!sound;this.textContent='♫ SON : '+(sound?'ON':'OFF');if(sound)tone(450)});
setInterval(function(){if(!playing)return;seconds--;ui();if(seconds<=0){playing=false;seconds=0;ui();msg.innerHTML='<span class="lose">⏱ TEMPS ÉCOULÉ ! Appuie sur JOUER pour réessayer.</span>';tone(140)}},1000);
// Visible demo grid before pressing play.
makeLevel();playing=false;seconds=45;ui();msg.innerHTML='Appuie sur <b>▶ JOUER</b>, puis clique sur les cases pour relier <b style="color:#6bffb3">S</b> à <b style="color:#ffa5ed">C</b>.';
})();
</script></body></html>
