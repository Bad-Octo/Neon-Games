<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEON FLOOD — HARDCORE</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#1c2056,#050716 70%);color:#eef9ff;font:16px system-ui,Arial;display:flex;justify-content:center;padding:20px 12px}.app{width:min(100%,650px);text-align:center}h1{font-size:clamp(24px,5vw,42px);color:#6ff7ff;text-shadow:0 0 19px #00e1ff;margin:10px 0 3px}.tag{color:#ff82ce;letter-spacing:3px;font-weight:900;font-size:12px}.desc{color:#a9b7d8;margin:7px 0 15px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.stat{background:#141d3c;border:1px solid #344976;border-radius:12px;padding:10px 4px}.stat strong{display:block;color:#85f5ff;font-size:22px}.stat small{color:#b5c7e0}.board{--size:10;display:grid;grid-template-columns:repeat(var(--size),1fr);gap:2px;width:min(100%,510px);aspect-ratio:1;margin:0 auto;padding:5px;background:#111c3a;border:2px solid #55deff;border-radius:13px;box-shadow:0 0 24px #08ceff4d}.cell{min-width:0;border-radius:2px;box-shadow:inset 0 0 6px #ffffff36;transition:background .08s}.cell.territory{outline:1px solid #ffffffcc;outline-offset:-1px}.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px auto;max-width:510px}.paint{height:54px;border-radius:11px;border:2px solid #ffffff55;cursor:pointer;color:#060a1b;font-size:19px;font-weight:900;box-shadow:0 0 12px var(--glow);touch-action:manipulation}.paint:disabled{opacity:.3;cursor:default}.actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}button.action{border:1px solid #60edff;color:#fff;background:#132b52;border-radius:10px;font:700 14px system-ui;padding:11px 17px;cursor:pointer}.action:disabled{opacity:.35;cursor:default}.message{font-weight:750;min-height:28px;margin:13px 0;color:#ffd875}.note{font-size:13px;color:#aabbd1}button:focus-visible{outline:3px solid white;outline-offset:3px}</style><script>function reportArcade(value){const n=Number(value);if(Number.isFinite(n)&&n>=0){try{parent.postMessage({neonArcadeScore:true,score:Math.round(n)},'*')}catch(e){}}}</script></head><body><main class="app"><div class="tag">MODE EXPERT</div><h1>🌈 NEON FLOOD</h1><p class="desc">Conquiers toutes les cases depuis le coin supérieur gauche. Une couleur = un coup. Aucun retour en arrière !</p><section class="stats"><div class="stat"><strong id="level">1 / 5</strong><small>NIVEAU</small></div><div class="stat"><strong id="moves">0 / 0</strong><small>COUPS</small></div><div class="stat"><strong id="pct">0%</strong><small>CONQUIS</small></div></section><div id="board" class="board" role="img" aria-label="Grille de couleurs"></div><div class="palette" id="palette" aria-label="Choisir une couleur"></div><div class="actions"><button class="action" id="retry">↻ Rejouer ce niveau</button><button class="action" id="next" disabled>▶ Niveau suivant</button><button class="action" id="sound">🔊 Son</button></div><div class="message" id="message" aria-live="polite"></div><p class="note">Touches 1–6 ou clic/toucher • 5 niveaux difficiles • Fonctionne hors ligne</p></main><script>
'use strict';const colors=['#48efff','#ff65ba','#ffd85f','#a58aff','#6afa8c','#ff9060'];const $=id=>document.getElementById(id);let level=1,N=10,board=[],limit=0,moves=0,status='play',sound=true,ctx=null,original=[];
function beep(f=460){if(!sound)return;try{ctx??=new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(ctx.destination);g.gain.setValueAtTime(.045,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.10);o.start();o.stop(ctx.currentTime+.10)}catch(_){}}
function region(b){const found=new Uint8Array(b.length),s=[0],members=[0],color=b[0];found[0]=1;while(s.length){const id=s.pop(),x=id%N,y=Math.floor(id/N);for(const nb of [x>0?id-1:-1,x<N-1?id+1:-1,y>0?id-N:-1,y<N-1?id+N:-1]){if(nb>=0&&!found[nb]&&b[nb]===color){found[nb]=1;members.push(nb);s.push(nb)}}}return members}
function flood(b,c){const r=region(b);if(b[0]===c)return r.length;for(const i of r)b[i]=c;return region(b).length}
function greedySteps(b){b=b.slice();let count=0;while(region(b).length<b.length&&count<100){let best=-1,bestSize=-1;for(let c=0;c<6;c++){if(c===b[0])continue;const copy=b.slice(),size=flood(copy,c);if(size>bestSize){bestSize=size;best=c}}if(best<0)break;flood(b,best);count++}return count}
function makeLevel(){N=[10,11,12,13,14][level-1];$('board').style.setProperty('--size',N);let attempts=0;do{board=Array.from({length:N*N},()=>Math.floor(Math.random()*6));attempts++}while(region(board).length>N*N*.28&&attempts<30);original=board.slice();const estimated=greedySteps(original);limit=Math.max(10,estimated+([2,1,1,0,0][level-1]));moves=0;status='play';draw();}
function draw(){const r=region(board),owned=new Set(r),root=$('board');root.replaceChildren();for(let i=0;i<board.length;i++){const el=document.createElement('div');el.className='cell'+(owned.has(i)?' territory':'');el.style.background=colors[board[i]];root.appendChild(el)}$('level').textContent=level+' / 5';$('moves').textContent=moves+' / '+limit;$('pct').textContent=Math.round(100*r.length/board.length)+'%';$('next').disabled=status!=='won'||level===5;$('message').textContent=status==='won'?(level===5?'🏆 INCROYABLE ! Tu as terminé le mode HARDCORE !':'✅ Niveau réussi ! Passe au suivant.') :status==='lost'?'💥 Plus de coups ! Rejoue ce niveau pour retenter ta chance.':`Plus que ${limit-moves} coups. Réfléchis bien !`;for(const b of document.querySelectorAll('.paint'))b.disabled=status!=='play'||Number(b.dataset.color)===board[0]}
function pick(c){if(status!=='play'||c===board[0])return;flood(board,c);moves++;beep(320+c*80);if(region(board).length===board.length){status='won';reportArcade(moves);beep(950)}else if(moves>=limit){status='lost';beep(150)}draw()}
for(let i=0;i<6;i++){const b=document.createElement('button');b.className='paint';b.dataset.color=i;b.style.background=colors[i];b.style.setProperty('--glow',colors[i]+'77');b.setAttribute('aria-label','Couleur '+(i+1));b.textContent=i+1;b.addEventListener('click',()=>pick(i));$('palette').appendChild(b)}$('retry').addEventListener('click',()=>{board=original.slice();moves=0;status='play';draw()});$('next').addEventListener('click',()=>{if(status==='won'&&level<5){level++;makeLevel()}});$('sound').addEventListener('click',()=>{sound=!sound;$('sound').textContent=sound?'🔊 Son':'🔇 Muet'});document.addEventListener('keydown',e=>{if(e.key>='1'&&e.key<='6')pick(Number(e.key)-1)});makeLevel();
</script></body></html>
