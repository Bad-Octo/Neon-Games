<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>flood — Mode Medium</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07091c;color:#e9f8ff;font-family:system-ui,Arial}body{display:flex;align-items:center;justify-content:center;padding:15px;background:radial-gradient(ellipse at top,#192451,#07091c 75%)}.shell{width:min(100%,760px);text-align:center}h1{margin:8px;color:#76faff;text-shadow:0 0 18px #00dafa;font-size:clamp(25px,6vw,41px)}p{color:#b1bfd9;margin:9px}canvas{display:block;width:100%;height:auto;touch-action:none;background:#080e25;border:2px solid #40e8ff;border-radius:14px;box-shadow:0 0 26px #11aaff55}.hud{display:flex;justify-content:space-around;gap:8px;margin:14px 0;font-weight:800;color:#ffdd7c}.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:12px}button{border:1px solid #75faff;border-radius:10px;padding:11px 19px;background:#12234a;color:#fff;font-size:16px;font-weight:700;cursor:pointer;touch-action:manipulation;box-shadow:0 0 12px #22d9f944}button:active{transform:scale(.96);background:#25558b}.small{font-size:13px;color:#91a8c7}</style><style>h1{text-shadow:0 0 18px #f7c65b!important}body:before{content:"MODE MEDIUM";position:fixed;top:5px;right:7px;z-index:1000;color:#ffde84;background:#37231b;border:1px solid #ffcf70;border-radius:7px;padding:4px 8px;font:700 10px system-ui;pointer-events:none}</style><script>function reportArcade(value){const n=Number(value);if(Number.isFinite(n)&&n>=0){try{parent.postMessage({neonArcadeScore:true,score:Math.round(n)},'*')}catch(e){}}}</script></head><body><main class="shell"><h1>🌈 NEON FLOOD · MEDIUM</h1><p>Conquiers toute la grille en changeant sa couleur en un minimum de coups.</p><div class="hud"><span id="moves">Coups : 0 / 24</span><span id="owned">Territoire : 0%</span><span id="best">Record : —</span></div><canvas id="game" width="720" height="480" aria-label="Plateau de jeu"></canvas><div class="controls"><button id="start">↻ Nouvelle grille</button><button id="sound" onclick="toggleSound()">🔊 Son</button></div><div class="small">🎵 Son activable • Record sauvegardé localement • Fonctionne hors ligne</div></main><script>const c=document.getElementById('game'),ctx=c.getContext('2d');let audio=null,sound=true;function tone(freq=440,dur=.09){if(!sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.value=freq;o.connect(g);g.connect(audio.destination);g.gain.setValueAtTime(.075,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.start();o.stop(audio.currentTime+dur)}catch(e){}}function toggleSound(){sound=!sound;document.getElementById('sound').textContent=sound?'🔊 Son':'🔇 Muet'}function text(t,x,y,size=24,color='#fff'){ctx.fillStyle=color;ctx.font='bold '+size+'px system-ui';ctx.textAlign='center';ctx.fillText(t,x,y)}function overlay(title,sub){ctx.fillStyle='#050c21dd';ctx.fillRect(0,0,720,480);text(title,360,216,36,'#7efaff');text(sub,360,258,18,'#fff')}function glow(color,blur=14){ctx.shadowColor=color;ctx.shadowBlur=blur}function clear(){ctx.shadowBlur=0;ctx.fillStyle='#080e25';ctx.fillRect(0,0,720,480);ctx.strokeStyle='#1a2a4a';ctx.lineWidth=1;for(let x=0;x<720;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,480);ctx.stroke()}for(let y=0;y<480;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(720,y);ctx.stroke()}}const palette=['#44f4ff','#ff5fbb','#f9dc6b','#a777ff','#5cff94','#ff895c'];const N=13;let board=[],moves=0,limit=23,won=false,over=false,best=localStorage.getItem('neon-flood-medium-best');function start(){board=Array.from({length:N*N},()=>Math.floor(Math.random()*6));moves=0;won=false;over=false;update()}function update(){document.getElementById('moves').textContent='Coups : '+moves+' / '+limit;document.getElementById('owned').textContent='Territoire : '+Math.round(owned().length/(N*N)*100)+'%';document.getElementById('best').textContent='Record : '+(best||'—')}function owned(){let seen=new Set([0]),stack=[0],color=board[0];while(stack.length){let a=stack.pop(),x=a%N,y=Math.floor(a/N);for(const [xx,yy] of [[x+1,y],[x-1,y],[x,y+1],[x,y-1]]){let b=yy*N+xx;if(xx>=0&&xx<N&&yy>=0&&yy<N&&!seen.has(b)&&board[b]===color){seen.add(b);stack.push(b)}}}return [...seen]}function choose(color){if(over||won||color===board[0])return;let indices=owned();for(const i of indices)board[i]=color;moves++;tone(260+color*86,.12);let filled=owned().length;if(filled===N*N){won=true;reportArcade(moves);best=!best||moves<+best?moves:best;localStorage.setItem('neon-flood-medium-best',best);tone(1000,.3)}else if(moves>=limit)over=true;update()}document.getElementById('start').onclick=start;c.addEventListener('pointerdown',e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)*720/r.width,y=(e.clientY-r.top)*480/r.height;if(y>416){let i=Math.floor((x-150)/72);if(i>=0&&i<6)choose(i)}});document.addEventListener('keydown',e=>{let i=Number(e.key)-1;if(i>=0&&i<6)choose(i)});function frame(){clear();let size=31.4,left=171,top=17;for(let y=0;y<N;y++)for(let x=0;x<N;x++){let col=palette[board[y*N+x]];ctx.fillStyle=col;glow(col,3);ctx.fillRect(left+x*size+2,top+y*size+2,size-4,size-4)}ctx.shadowBlur=0;for(let i=0;i<6;i++){let x=150+i*72;glow(palette[i],10);ctx.fillStyle=palette[i];ctx.fillRect(x,420,61,42);ctx.shadowBlur=0;text(String(i+1),x+30,449,19,'#091328')}if(won||over)overlay(won?'GRILLE CONQUISE !':'PLUS DE COUPS',won?'Bravo ! '+moves+' coups • Nouvelle grille pour rejouer':'Réessaie avec une autre stratégie !');requestAnimationFrame(frame)}start();frame();</script></body></html>
